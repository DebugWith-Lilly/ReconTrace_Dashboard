<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RECONTRACE | Sign In</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <!-- LEFT SIDE -->
        <div class="login-left">

            <div class="brand">
                <h1>RECONTRACE</h1>

                <p>
                    AI-Powered Crime Scene Reconstruction
                </p>
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-right">

            <div class="login-card">

                <h2>Welcome Back</h2>

                <p class="login-subtitle">
                    Sign in to access your investigation dashboard.
                </p>


                <!-- LOGIN FORM -->
                <form id="loginForm">

                    <!-- EMAIL -->
                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="investigator@recontrace.co.za"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- SIGN IN -->
                    <button
                        type="submit"
                        class="sign-in-btn"
                    >
                        Sign In
                    </button>

                </form>


                <!-- DIVIDER -->
                <div class="divider">
                    <span>OR</span>
                </div>


                <!-- SECURE ID -->
                <button
                    type="button"
                    class="secure-id-btn"
                >
                    Sign in with Secure ID
                </button>


                <!-- SIGN UP LINK -->
                <p class="account-link">

                    Don't have an account?

                    <a href="signup.html">
                        Create an account
                    </a>

                </p>

            </div>

        </div>

    </div>


    <!-- LOGIN JAVASCRIPT -->
    <script src="js/login.js"></script>

</body>
</html>
